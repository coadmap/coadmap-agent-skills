# 検証用(マージしない)。allowed actions の制限が効いていれば両ジョブとも起動前に失敗する
name: verify-actions-policy
on: pull_request
permissions:
  contents: read
jobs:
  third-party-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@cd1afbd7852b7ad7b1b7a9a1b03efebd3b0a1820 # v3.0.0
  github-owned-unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
