name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # 利用者の主戦場は macOS(bash 3.2 / BSD find・tr)なので、Linux との差を CI で押さえる
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - if: runner.os == 'macOS'
        run: brew install shellcheck jq
      - run: bash scripts/lint.sh
      - run: bash scripts/test.sh
